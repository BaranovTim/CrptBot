# TradingBot on a server.
#
# Two containers, one image. The collector records bars forever; the API reads
# them. They share the bar store and the frozen models through bind mounts, so
# `docker compose pull && up -d` never loses history.
#
#   cp .env.example .env && edit it        <- put a real token in
#   docker compose up -d
#   docker compose logs -f api
#
# See DEPLOY.md before exposing this to the internet.

services:
  api:
    build: .
    image: tradingbot:latest
    restart: unless-stopped
    environment:
      # Required. The API refuses to bind to anything but loopback without it.
      TRADINGBOT_TOKEN: ${TRADINGBOT_TOKEN:?set TRADINGBOT_TOKEN in .env}
      # WHICH PAIRS THIS BOX KEEPS WARM AND WATCHES FOR ALERTS.
      #
      # Measured, not chosen for tidiness: one cold dashboard build peaks
      # near 750MB and this droplet has 967MB. Letting the recorder walk
      # every trained symbol (14 x 4 intervals = 56 builds) put it into the
      # OOM killer three times in an hour, taking the API down each time.
      #
      # Everything NOT listed here is still served — built on demand and
      # cached — it simply is not pre-warmed or watched for signal changes.
      # Raise this list when the box has the RAM to carry it.
      RECORD_SYMBOLS: ${RECORD_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT,ADAUSDT,XRPUSDT,ZECUSDT,HYPEUSDT,DOGEUSDT,BNBUSDT,ENAUSDT,UNIUSDT,NEARUSDT,SUIUSDT,1000PEPEUSDT,ARBUSDT}
      # OPTIONAL, deliberately — note `:-` and not `:?`.
      #
      # Without these the equity screener has no data and says so; with `:?`
      # the whole stack would refuse to start, taking the crypto side down
      # over a feature it does not use. A missing key must degrade one page,
      # not the deployment.
      ALPACA_KEY_ID: ${ALPACA_KEY_ID:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      # Billing, optional for the same reason. Unset, /api/billing/plans still
      # answers and says checkout is not configured; the rest of the app is
      # untouched. `:?` here would mean a Stripe typo takes the bot offline.
      #
      # PUBLIC_BASE_URL is not decoration: Stripe redirects the customer back
      # here after paying and posts the webhook here, so it must be the URL a
      # phone can actually reach, not localhost.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Email confirmation. Unset, new accounts are created already
      # confirmed and no mail is attempted; set, they wait for the link.
      # The requirement follows the capability -- see api/mail.py.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Sign in with a provider. A provider with no credentials is simply
      # not offered; the app draws buttons only for what the server reports.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_CLIENT_ID: ${OAUTH_FACEBOOK_CLIENT_ID:-}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET:-}
      OAUTH_APPLE_CLIENT_ID: ${OAUTH_APPLE_CLIENT_ID:-}
      OAUTH_APPLE_TEAM_ID: ${OAUTH_APPLE_TEAM_ID:-}
      OAUTH_APPLE_KEY_ID: ${OAUTH_APPLE_KEY_ID:-}
      OAUTH_APPLE_PRIVATE_KEY: ${OAUTH_APPLE_PRIVATE_KEY:-}
    volumes:
      - ./data_cache:/app/data_cache
      - ./output:/app/output
    ports:
      # Loopback by default. Reaching it from outside is the reverse proxy's or
      # the VPN's job. Never set BIND_ADDR to 0.0.0.0 — Docker writes its own
      # iptables rules, so that publishes the port straight past `ufw` and onto
      # the public internet. For Tailscale, set it to the tailnet IP
      # (100.x.y.z), which is an interface no stranger can route to.
      - "${BIND_ADDR:-127.0.0.1}:8787:8787"
    deploy:
      resources:
        limits:
          # measured: ~300MB with all six timeframes cached. The limit is a
          # backstop against a leak, not a target
          memory: 1g

  collector:
    build: .
    image: tradingbot:latest
    restart: unless-stopped
    # Every pair that has fitted models must be named here. `--symbol`
    # defaults to BTCUSDT alone, so ETH/SOL/ADA were served from a store that
    # nothing was updating — the app correctly showed STALE and there was no
    # process whose job it was to fix that.
    #
    # Adding a coin in the app does NOT make the server collect it. The
    # watchlist is a device preference; this list is what the server records.
    #
    # NOR DOES TRAINING ONE. Models fitted on a laptop and rsynced here make
    # the server *offer* a pair — `trained_symbols()` reads `output/` — while
    # nothing fills its bar store. The symptom is the app loading forever and
    # then timing out, because the dashboard build has no bars and tries to
    # seed a full history inside the request. Ship the bars with the models,
    # and add the pair here in the same change.
    environment:
      ALPACA_KEY_ID: ${ALPACA_KEY_ID:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
    command: >
      python3 collect.py
      --symbol BTCUSDT --symbol ETHUSDT
      --symbol SOLUSDT --symbol ADAUSDT
      --symbol XRPUSDT --symbol ZECUSDT
      --symbol HYPEUSDT --symbol DOGEUSDT
      --symbol BNBUSDT --symbol ENAUSDT
      --symbol UNIUSDT --symbol NEARUSDT
      --symbol SUIUSDT --symbol 1000PEPEUSDT
      --symbol ARBUSDT
      --interval 1m --interval 15m
      --interval 1h --interval 4h --interval 1d
    healthcheck:
      # NOT the image's default check — that one curls the API port, which
      # nothing serves in this container, so the collector would sit at
      # "unhealthy" forever while working perfectly.
      #
      # What actually matters is whether bars are still arriving. The current
      # month's 1m CSV is rewritten on every close, so a file untouched for
      # five minutes means the collector has gone quiet — which is the failure
      # that would otherwise be invisible until the app said STALE.
      test: ["CMD-SHELL", "find /app/data_cache/live -path '*/1m/*.csv' -newermt '-5 minutes' | grep -q ."]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 3
    volumes:
      - ./data_cache:/app/data_cache
      - ./output:/app/output
    deploy:
      resources:
        limits:
          memory: 256m
